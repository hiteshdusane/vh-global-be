spring.application.name=vhn-global
spring.datasource.url=jdbc:mysql://localhost:3306/vhn_global_core
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080
##spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
storage.base-path=uploads
storage.image-path=${storage.base-path}/images
storage.image-serve-path=file:./${storage.image-path}/
storage.image-handler=/images/**
image.base-url=http://localhost:8080/images/
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.org.springframework.web.servlet.resource=ERROR
spring.profiles.active=no-security
jwt.secret-key=wH0Hzn1vj0CBB8+qYUYz7VSpO9B7r8FeRXGeYlD6ysM=
security.enabled=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
server.compression.min-response-size=1024
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,application/json
